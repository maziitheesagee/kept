<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Kept – habit tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f0;--ink:#151a33;--mut:#62667e;--card:#fff;--line:#e4e2d9;--ok:#1f8a70;--hot:#e89a00;--tint:#efede4;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1224;--ink:#f1f0ea;--mut:#9a9eb8;--card:#181c36;--line:#2a2f52;--ok:#3cc9a3;--hot:#ffbe2e;--tint:#20254a;--on:#0f1224}}
:root[data-theme="dark"]{--bg:#0f1224;--ink:#f1f0ea;--mut:#9a9eb8;--card:#181c36;--line:#2a2f52;--ok:#3cc9a3;--hot:#ffbe2e;--tint:#20254a;--on:#0f1224}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--on);font-style:normal;font-size:15px}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.pitch{background:#151a33;color:#f6f5f0;padding:40px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.pitch .logo i{background:#f6f5f0;color:#151a33}
.pitch h1{font-size:clamp(34px,5vw,58px);font-weight:800;max-width:14ch}
.pitch p{margin:0;max-width:44ch;color:#b9bdd6;font-size:17px}
.demo{background:#1f2547;border-radius:16px;padding:16px;max-width:420px;display:grid;gap:12px}
.demo .r{display:flex;align-items:center;gap:12px}.demo .r span{width:96px}.demo .r b{margin-left:auto;color:#ffbe2e}
.dots{display:flex;gap:6px}.dots u{width:22px;height:22px;border-radius:7px;background:#2f3662}.dots u.f{background:#3cc9a3}
.formwrap{display:grid;place-items:center;padding:32px 20px}
.af{width:100%;max-width:380px;display:grid;gap:14px}
.af h2{font-size:30px;font-weight:800}
.fld{display:grid;gap:6px;font-weight:600;font-size:14px}
.fld input{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);width:100%;font-weight:400}
.pwr{position:relative}.pwr button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--mut);padding:6px}
.btn{background:var(--ink);color:var(--on);padding:13px 18px;border-radius:12px;font-weight:700}
.btn.sec{background:var(--tint);color:var(--ink)}.btn.dan{background:none;color:#d6453d}
.lnk{color:var(--ok);font-weight:700}
.err{color:#d6453d;margin:0;min-height:1.3em;font-size:14px}
.note{color:var(--mut);font-size:13px;margin:0}
@media(max-width:800px){.auth{grid-template-columns:1fr}.pitch{padding:32px 22px;gap:16px}.demo{display:none}}
/* app */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top>div{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mut)}
.tabs button[aria-current=page]{background:var(--ink);color:var(--on)}
.av{margin-left:auto;position:relative}
.av>button{width:36px;height:36px;border-radius:50%;background:var(--ok);color:#fff;font-weight:800}
.pop{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:210px;display:grid;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.pop small{color:var(--mut);word-break:break-all}
main{max-width:1100px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:12px}
.hero{display:flex;align-items:center;gap:18px;justify-content:space-between}
.hero h2{font-size:30px;font-weight:800}.hero p{margin:6px 0 0;color:var(--mut)}
.ring{width:96px;height:96px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.hc{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
.hc.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;background:var(--card)}
.chip:hover{border-color:var(--ink)}
.empty{text-align:center;padding:26px 10px;display:grid;gap:12px;justify-items:center}.empty h3{font-size:22px;margin:0}.empty p{margin:0;color:var(--mut);max-width:38ch}
.mood{display:flex;gap:8px}.mood button{font-size:26px;padding:6px 10px;border-radius:12px;border:1.5px solid transparent;filter:grayscale(1);opacity:.6}.mood button[aria-pressed=true]{filter:none;opacity:1;border-color:var(--hot)}
.well{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.sl{width:70px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:center}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}.nav b{font-size:20px;min-width:160px;text-align:center}
.nav button{padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.g{font-size:12px;width:auto}.g th,.g td{padding:3px 1px;text-align:center}
.g th.h{position:sticky;left:0;background:var(--card);text-align:left;min-width:150px;padding:4px 8px;font-size:14px;z-index:1;border-right:1px solid var(--line)}
.g th.d{font-weight:600;min-width:26px}.g th.d small{display:block;color:var(--mut);font-weight:400;font-size:10px}
.g .w{border-left:2px solid var(--line)}.g .nw{background:var(--tint)}
.g tr+tr td,.g tr+tr th{border-top:1px solid var(--line)}
.g input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:2px;border:1.5px solid var(--mut);border-radius:6px;background:var(--card);cursor:pointer;vertical-align:middle;display:inline-grid;place-content:center}
.g input:checked{background:var(--ok);border-color:var(--ok)}
.g input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.g input:disabled{opacity:.3;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two>.card{margin:0}
@media(max-width:820px){.two{grid-template-columns:1fr}.two>.card{margin-bottom:14px}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.kp b{display:block;font-size:28px;font-weight:800}.kp span{color:var(--mut);font-size:13px}
.an th,.an td{padding:8px 6px;text-align:right;border-top:1px solid var(--line)}.an th:first-child,.an td:first-child{text-align:left}.an thead th{border:0;color:var(--mut);font-weight:600;font-size:12px}
.pb{height:9px;background:var(--tint);border-radius:5px;min-width:70px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
.ch{display:block;height:130px}.ch rect{fill:var(--ok)}.ch text{fill:var(--mut);font-size:9px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on);padding:14px 20px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:4}
.ov{position:fixed;inset:0;background:rgba(10,12,28,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.md{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:440px;display:grid;gap:16px}
.md h2{font-size:24px}
.em{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.em button{font-size:24px;padding:8px;border-radius:12px;border:1.5px solid var(--line)}.em button[aria-pressed=true]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.dw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dw button{padding:10px 0;border-radius:10px;border:1.5px solid var(--line);font-weight:700}.dw button[aria-pressed=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2 .btn{flex:1}
@media(max-width:700px){.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}.hero h2{font-size:24px}.nav b{min-width:0;flex:1}}

body{background:radial-gradient(900px 420px at 90% -8%,color-mix(in srgb,var(--ok) 16%,transparent),transparent),radial-gradient(700px 400px at -5% 0%,color-mix(in srgb,#5b6cff 12%,transparent),transparent),var(--bg);background-attachment:fixed}
.pitch{background:radial-gradient(620px 420px at 95% 0%,#3446c9,transparent 70%),radial-gradient(520px 420px at 0% 100%,rgba(31,138,112,.75),transparent 70%),#121733}
.pitch h1{font-size:clamp(40px,6vw,74px);max-width:11ch;line-height:1}
.demo{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);border-radius:20px;padding:18px;transform:rotate(-1.5deg)}
.dots u{width:24px;height:24px}
.af{background:var(--card);padding:30px;border-radius:26px;border:1px solid var(--line);box-shadow:0 24px 60px -28px rgba(20,26,51,.45)}
.fld input:focus{outline:0;border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.btn{transition:transform .12s,box-shadow .12s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}.btn:active{transform:scale(.98)}
.tabs{background:var(--tint);padding:4px;border-radius:14px}.tabs button{border-radius:11px}
.card{border-radius:22px;box-shadow:0 10px 28px -18px rgba(20,26,51,.35)}
.hero{background:linear-gradient(135deg,#151a33 0%,#2b3a9a 62%,#1f8a70 120%);color:#fff;border:0;padding:26px;border-radius:28px;box-shadow:0 20px 44px -22px rgba(43,58,154,.8)}
.hero h2{font-size:clamp(26px,4vw,38px)}.hero p{color:rgba(255,255,255,.78)}
.hero circle:first-child{stroke:rgba(255,255,255,.2)}.hero circle:last-child{stroke:#fff}
.ring{width:104px;height:104px}.ring svg{width:104px;height:104px}.ring b{font-size:24px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.wd{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:9px 0;display:grid;gap:5px;justify-items:center;font-weight:600}.wd small{color:var(--mut);font-weight:500}.wd.t{border-color:var(--ink)}
.wd i{width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--q)*360deg),var(--tint) 0);-webkit-mask:radial-gradient(circle,transparent 6px,#000 7px);mask:radial-gradient(circle,transparent 6px,#000 7px)}
.hc{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:20px;padding:14px;box-shadow:0 8px 22px -18px rgba(20,26,51,.5);transition:background .2s}
.hc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card))}
.ei{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 18%,var(--card));flex:none}
.chk{width:50px;height:50px;border-color:var(--c);transition:transform .12s,background .15s}.chk:active{transform:scale(.88)}
.on .chk{background:var(--c);border-color:var(--c)}
.mini i{background:var(--c)}.hi b{font-size:17px;letter-spacing:-.01em}
.fab{background:linear-gradient(135deg,#2b3a9a,#1f8a70);color:#fff}
.kp b{font-size:34px;letter-spacing:-.03em}.kp div{border-radius:20px}
.cl{display:flex;gap:10px;flex-wrap:wrap}.cl button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px transparent}.cl button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.md{border-radius:26px}

.mot{display:grid;gap:4px;padding:14px 16px;margin-bottom:14px;border-radius:18px;background:color-mix(in srgb,var(--hot) 14%,var(--card));border:1px solid color-mix(in srgb,var(--hot) 35%,var(--line))}.mot b{font-size:16px}.mot span{color:var(--mut)}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}.bd{text-align:center;padding:12px 6px;border-radius:16px;border:1.5px solid var(--hot);background:color-mix(in srgb,var(--hot) 12%,var(--card));font-size:13px;font-weight:600;display:grid;gap:4px}.bd span{font-size:30px}.bd.lk{border:1.5px dashed var(--line);background:none;color:var(--mut)}.bd.lk span{filter:grayscale(1);opacity:.4}.bd small{font-weight:400;color:var(--mut);font-size:11px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--on);padding:12px 18px;border-radius:999px;font-weight:700;z-index:40;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:92vw;text-align:center;animation:ti .25s ease-out}
@keyframes ti{from{opacity:0;transform:translate(-50%,-12px)}}
.cf{position:fixed;top:28vh;width:9px;height:14px;border-radius:2px;z-index:30;pointer-events:none}
</style>

<body>
<div id="app"></div>
<script>
(()=>{
const KEY="kept-v1";let DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
DB=DB&&DB.users?DB:{users:{},data:{},session:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const user=()=>DB.session&&DB.users[DB.session],D=()=>DB.data[DB.session]||(DB.data[DB.session]={habits:[],log:{},mood:{},sleep:{}});
let mode="up",err="",draft={fn:"",em:""},show=false,view="today",cur=new Date(),modal=null,menu=false;cur.setDate(1);
const PAL=["#ef476f","#f78c1f","#d9a400","#2fb67c","#1ba5c9","#5b6cff","#a05bff","#e24a9b"],col=h=>h.color||PAL[[...h.id].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];

const MS=[3,7,14,30,60,100,365],CHEER=["Nice. One more kept promise.","That's momentum.","Done. Future you says thanks.","Small win, real progress.","Look at you showing up."];
const QS=["Small steps, repeated daily, beat big plans left for later.","You don't need motivation. You need the next tiny action.","Every check-in is a vote for the person you're becoming.","Consistency isn't intensity. Just show up today.","Missed yesterday? Today is a clean page.","Progress is quiet. Keep stacking days.","Make it easy, make it small, make it daily.","The streak is built on ordinary days.","Do it badly if you must, but do it today.","Your future self is watching what you do now.","Discipline is a kindness to tomorrow.","One percent better still counts.","Start before you feel ready."];
function mot(p){const d=D(),T=new Date(),i=Math.floor((T-new Date(T.getFullYear(),0,0))/864e5),m=!d.habits.length?"Every streak starts with day one.":p>=100?"Perfect day. You kept every promise.":p>=50?"Past halfway. Finish strong.":p>0?"Good start. Momentum is the hard part.":"One small win gets the day moving.";return`<div class="mot"><b>${m}</b><span>${QS[i%QS.length]}</span></div>`}
function best(id){const k=Object.keys(D().log[id]||{}).sort();let b=0,c=0,q=null;k.forEach(x=>{const t=new Date(x+"T00:00:00");c=q&&Math.round((t-q)/864e5)===1?c+1:1;q=t;if(c>b)b=c});return b}
function badges(){const d=D(),H=d.habits,L=h=>d.log[h.id]||{},dt=new Set();H.forEach(h=>Object.keys(L(h)).forEach(k=>dt.add(k)));let pf=0;dt.forEach(k=>{if(H.every(h=>L(h)[k]))pf++});const T=H.reduce((a,h)=>a+Object.keys(L(h)).length,0),B=Math.max(0,...H.map(h=>best(h.id)));
const A=[["🌱","First check-in","Check off a habit",T>=1],["🔥","3-day streak","Keep one going 3 days",B>=3],["⚡","7-day streak","Keep one going 7 days",B>=7],["🏆","30-day streak","Keep one going 30 days",B>=30],["⭐","Perfect day","Finish every habit in a day",pf>=1],["💯","100 check-ins","Reach 100 in total",T>=100]],e=A.filter(a=>a[3]).length;
return`<section class="card"><h3>Achievements · ${e} of ${A.length}</h3><div class="bgs">${A.map(a=>`<div class="bd ${a[3]?"":"lk"}"><span>${a[0]}</span>${a[1]}${a[3]?"":`<small>${a[2]}</small>`}</div>`).join("")}</div></section>`}
function pop(m,big){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);if(big&&!matchMedia("(prefers-reduced-motion: reduce)").matches)for(let i=0;i<46;i++){const c=document.createElement("i");c.className="cf";c.style.cssText="left:"+(30+Math.random()*40)+"vw;background:"+PAL[i%8];document.body.appendChild(c);c.animate([{transform:"none",opacity:1},{transform:"translate("+((Math.random()-.5)*60)+"vw,"+(55+Math.random()*40)+"vh) rotate("+Math.random()*720+"deg)",opacity:0}],{duration:1400+Math.random()*900,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>c.remove()}}
const EMO=["💧","🏃","📖","🧘","😴","✍️","🥗","💪","🎯","🧠","☀️","🙏"];
const START=[["💧","Drink water",7],["🏃","Exercise",4],["📖","Read 20 pages",5],["🧘","Meditate",5],["😴","Sleep by 11pm",6],["✍️","Journal",3]];
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
async function hash(p,salt){const e=new TextEncoder(),k=await crypto.subtle.importKey("raw",e.encode(p),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:e.encode(salt),iterations:100000,hash:"SHA-256"},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
function streak(id){const L=D().log[id]||{};let d=new Date(),n=0;if(!L[ds(d)])d.setDate(d.getDate()-1);while(L[ds(d)]){n++;d.setDate(d.getDate()-1)}return n}
function week(id){const L=D().log[id]||{},s=(new Date().getDay()+6)%7;let c=0;for(let i=0;i<=s;i++){const x=new Date();x.setDate(x.getDate()-i);if(L[ds(x)])c++}return c}
const ml=(id,y,m)=>Object.keys(D().log[id]||{}).filter(k=>k.slice(0,7)===y+"-"+pad(m+1)).length;
function render(){const a=document.activeElement,f=a&&a.dataset?a.dataset.f:null;$("#app").innerHTML=user()?shell():authView();if(f){const e=document.querySelector('[data-f="'+f+'"]');e&&e.focus()}}
function authView(){const up=mode==="up";return`<div class="auth"><section class="pitch"><div class="logo"><i>✓</i>Kept</div><h1>Keep the promises you make to yourself.</h1><p>Pick the habits that matter, set your own goals, and watch your streaks grow one day at a time.</p><div class="demo" aria-hidden="true"><div class="r"><span>🏃 Run</span><div class="dots"><u class="f"></u><u class="f"></u><u class="f"></u><u></u><u class="f"></u><u class="f"></u><u class="f"></u></div><b>🔥 12</b></div><div class="r"><span>📖 Read</span><div class="dots"><u class="f"></u><u class="f"></u><u></u><u class="f"></u><u class="f"></u><u class="f"></u><u class="f"></u></div><b>🔥 8</b></div></div></section><section class="formwrap"><form class="af" id="af" novalidate><h2>${up?"Create your account":"Welcome back"}</h2>${up?`<label class="fld">Your name<input name="fn" autocomplete="name" value="${esc(draft.fn)}"></label>`:""}<label class="fld">Email<input name="em" type="email" autocomplete="email" value="${esc(draft.em)}"></label><label class="fld">Password<span class="pwr"><input name="pw" type="${show?"text":"password"}" autocomplete="${up?"new-password":"current-password"}" placeholder="${up?"At least 8 characters":""}"><button type="button" data-act="pw">${show?"Hide":"Show"}</button></span></label><p class="err" role="alert">${esc(err)}</p><button class="btn" type="submit">${up?"Create account":"Sign in"}</button><p class="note">${up?"Already have an account?":"New to Kept?"} <button type="button" class="lnk" data-act="mode">${up?"Sign in":"Create an account"}</button></p><p class="note">Accounts and habits are stored privately on this device.</p></form></section></div>`}
function nav(){const t=cur.toLocaleDateString(undefined,{month:"long",year:"numeric"});return`<div class="nav"><button data-act="prev" aria-label="Previous month">←</button><b>${t}</b><button data-act="next" aria-label="Next month">→</button><button data-act="now">Today</button></div>`}
function shell(){const u=user(),T=[["today","Today"],["month","Month"],["insights","Insights"]];
return`<div class="top"><div><div class="logo"><i>✓</i>Kept</div><nav class="tabs" aria-label="Views">${T.map(t=>`<button data-act="tab" data-v="${t[0]}" ${view===t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("")}</nav><div class="av"><button data-act="menu" aria-label="Account menu" aria-expanded="${menu}">${esc(u.name[0]||"?").toUpperCase()}</button>${menu?`<div class="pop"><b>${esc(u.name)}</b><small>${esc(DB.session)}</small><button class="btn sec" data-act="out">Sign out</button></div>`:""}</div></div></div><main>${view==="today"?today():view==="month"?month():insights()}</main><button class="fab" data-act="new">+ New habit</button>${modal?mdl():""}`}
function today(){const d=D(),t=ds(new Date()),H=d.habits,n=H.length,dn=H.filter(h=>(d.log[h.id]||{})[t]).length,p=n?Math.round(dn/n*100):0,hr=new Date().getHours(),g=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening",C=2*Math.PI*42;
let h=`<div class="card hero"><div><h2>${g}, ${esc(user().name.split(" ")[0])}</h2><p>${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}${n?` · ${dn} of ${n} done`:""}</p></div><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--tint)" stroke-width="9"/><circle cx="48" cy="48" r="42" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}"/></svg><b>${p}%</b></div></div>`;
const w2=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-((x.getDay()+6)%7)+i);const k=ds(x),c=H.filter(z=>(d.log[z.id]||{})[k]).length;return`<div class="wd${k===t?" t":""}"><small>${"MTWTFSS"[i]}</small><i style="--q:${n?c/n:0}"></i><span>${x.getDate()}</span></div>`}).join("");h+=`<div class="strip" aria-label="This week">${w2}</div>`+mot(p);if(!n)return h+`<div class="card empty"><h3>What do you want to keep doing?</h3><p>Add your own habit, or start with a few popular ones. You set the goal for each.</p><div class="chips">${START.map((s,i)=>`<button class="chip" data-act="starter" data-i="${i}">${s[0]} ${s[1]}</button>`).join("")}</div><button class="btn" data-act="new">Create your own habit</button></div>`;
h+=H.map(x=>{const on=(d.log[x.id]||{})[t],w=week(x.id),s=streak(x.id),nx=MS.find(m=>m>s);return`<div class="hc ${on?"on":""}" style="--c:${col(x)}"><button class="chk" data-act="tg" data-h="${x.id}" data-k="${t}" data-f="t:${x.id}" aria-pressed="${!!on}" aria-label="${esc(x.name)}: mark ${on?"not done":"done"}">✓</button><span class="ei">${x.emoji}</span><div class="hi"><b>${esc(x.name)}</b><small>${s?"🔥 "+s+" day"+(s>1?"s":"")+" · ":""}${w} of ${x.perWeek} this week${s&&nx?` · ${nx-s} to a ${nx}-day streak`:""}</small><div class="mini"><i style="width:${Math.min(100,w/x.perWeek*100)}%"></i></div></div><button class="ed" data-act="edit" data-h="${x.id}" aria-label="Edit ${esc(x.name)}">⋯</button></div>`}).join("");
const mo=d.mood[t];return h+`<div class="card"><h3>How is today?</h3><div class="well"><div class="mood" role="group" aria-label="Mood">${["😞","🙁","😐","🙂","😄"].map((e,i)=>`<button data-act="mood" data-v="${i+1}" aria-pressed="${mo===i+1}" aria-label="Mood ${i+1} of 5">${e}</button>`).join("")}</div><label>Sleep last night <input class="sl" data-sl="1" data-f="sl" inputmode="decimal" value="${d.sleep[t]||""}" placeholder="hrs"></label></div></div>`+badges()}
function month(){const d=D(),n=dim(cur),y=cur.getFullYear(),mo=cur.getMonth(),t=new Date(),nw=t.getFullYear()===y&&t.getMonth()===mo?t.getDate():0,fut=nw||(new Date(y,mo,1)>t?0:99),ds2=k=>y+"-"+pad(mo+1)+"-"+pad(k),days=[...Array(n)].map((_,i)=>i+1),W=k=>(k-1)%7===0&&k>1?"w ":"";
if(!d.habits.length)return nav()+`<div class="card empty"><h3>No habits yet</h3><p>Create a habit to start filling in your month.</p><button class="btn" data-act="new">Create a habit</button></div>`;
return nav()+`<div class="card sc"><table class="g"><thead><tr><th class="h">Habit</th>${days.map(k=>`<th class="d ${W(k)}${k===nw?"nw":""}"><small>${"SMTWTFS"[new Date(y,mo,k).getDay()]}</small>${k}</th>`).join("")}</tr></thead><tbody>${d.habits.map(x=>`<tr><th class="h">${x.emoji} ${esc(x.name)}</th>${days.map(k=>{const f=new Date(y,mo,k)>t;return`<td class="${W(k)}${k===nw?"nw":""}"><input type="checkbox" data-act="tg" data-h="${x.id}" data-k="${ds2(k)}" data-f="g:${x.id}:${k}" ${(d.log[x.id]||{})[ds2(k)]?"checked":""} ${f?"disabled":""} aria-label="${esc(x.name)} on day ${k}"></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`}
function bars(v,l,bw){const st=bw+6,W=v.length*st;return`<svg class="ch" viewBox="0 0 ${W} 112" style="width:${W}px;min-width:100%" role="img" aria-label="Progress chart">${v.map((x,i)=>`<rect x="${i*st+3}" y="${100-x}" width="${bw}" height="${Math.max(x,x?2:0)}" rx="3"/><text x="${i*st+3+bw/2}" y="110" text-anchor="middle">${l[i]}</text>`).join("")}</svg>`}
function insights(){const d=D(),n=dim(cur),y=cur.getFullYear(),mo=cur.getMonth(),H=d.habits;
if(!H.length)return nav()+`<div class="card empty"><h3>Nothing to analyze yet</h3><p>Add a habit and check it off to see your progress.</p><button class="btn" data-act="new">Create a habit</button></div>`;
const days=[...Array(n)].map((_,i)=>i+1),k=i=>y+"-"+pad(mo+1)+"-"+pad(i),per=days.map(i=>Math.round(H.filter(h=>(d.log[h.id]||{})[k(i)]).length/H.length*100)),wk=[],wl=[];
for(let s=1;s<=n;s+=7){const e=Math.min(s+6,n);let c=0;H.forEach(h=>{for(let i=s;i<=e;i++)if((d.log[h.id]||{})[k(i)])c++});wk.push(Math.round(c/(H.length*(e-s+1))*100));wl.push("Wk "+wk.length)}
const A=H.map(h=>{const g=Math.max(1,Math.round(h.perWeek*n/7)),a=ml(h.id,y,mo);return{h,g,a,p:Math.min(100,Math.round(a/g*100))}}),tot=A.reduce((s,x)=>s+x.a,0),best=Math.max(0,...H.map(h=>streak(h.id)));
return nav()+`<div class="kp"><div><b>${Math.round(tot/(H.length*n)*100)}%</b><span>of the month done</span></div><div><b>${tot}</b><span>check-ins</span></div><div><b>🔥 ${best}</b><span>longest current streak</span></div></div>${badges()}<div class="two"><section class="card"><h3>Daily progress</h3><div class="sc">${bars(per,days,16)}</div></section><section class="card"><h3>Weekly progress</h3>${bars(wk,wl,34)}</section></div><div style="height:14px"></div><section class="card sc"><h3>Goals this month</h3><table class="an"><thead><tr><th>Habit</th><th>Goal</th><th>Done</th><th>Left</th><th>Progress</th><th>%</th></tr></thead><tbody>${A.slice().sort((a,b)=>b.p-a.p).map(x=>`<tr><td>${x.h.emoji} ${esc(x.h.name)}</td><td>${x.g}</td><td>${x.a}</td><td>${Math.max(x.g-x.a,0)}</td><td><div class="pb"><i style="width:${x.p}%"></i></div></td><td>${x.p}%</td></tr>`).join("")}</tbody></table></section>`}
function mdl(){const m=modal;return`<div class="ov" data-act="close"><form class="md" id="hf" novalidate><h2>${m.id?"Edit habit":"New habit"}</h2><label class="fld">What will you track?<input id="hn" data-f="hn" maxlength="40" value="${esc(m.name)}" placeholder="e.g. Read 20 pages"></label><div><div class="fld">Icon</div><div class="em">${EMO.map(e=>`<button type="button" data-act="emoji" data-v="${e}" aria-pressed="${m.emoji===e}">${e}</button>`).join("")}</div></div><div><div class="fld">Color</div><div class="cl">${PAL.map(c=>`<button type="button" data-act="color" data-v="${c}" style="background:${c}" aria-pressed="${m.color===c}" aria-label="Color ${c}"></button>`).join("")}</div></div><div><div class="fld">Your goal: ${m.perWeek===7?"every day":m.perWeek+" days a week"}</div><div class="dw">${[1,2,3,4,5,6,7].map(i=>`<button type="button" data-act="pw7" data-v="${i}" aria-pressed="${m.perWeek===i}">${i}</button>`).join("")}</div></div><p class="err" role="alert">${esc(m.err||"")}</p><div class="row2"><button class="btn" type="submit">${m.id?"Save changes":"Add habit"}</button><button class="btn sec" type="button" data-act="close2">Cancel</button></div>${m.id?`<button class="btn dan" type="button" data-act="del">Delete habit</button>`:""}</form></div>`}
const sync=()=>{if(modal){const i=$("#hn");if(i)modal.name=i.value}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,x=b.dataset,d=user()?D():null;
if(a==="close"&&e.target!==b)return;if(a!=="menu")menu=false;
if(a==="mode"){mode=mode==="up"?"in":"up";err=""}
else if(a==="pw"){const f=$("#af");draft={fn:f.fn?f.fn.value:"",em:f.em.value};show=!show;const p=f.pw.value;render();$("#af").pw.value=p;return}
else if(a==="tab")view=x.v;
else if(a==="prev")cur.setMonth(cur.getMonth()-1);
else if(a==="next")cur.setMonth(cur.getMonth()+1);
else if(a==="now"){cur=new Date();cur.setDate(1)}
else if(a==="menu")menu=!menu;
else if(a==="out"){DB.session=null;menu=false;err="";mode="in";save()}
else if(a==="tg"){const L=d.log[x.h]||(d.log[x.h]={}),was=!!L[x.k];was?delete L[x.k]:L[x.k]=1;save();const t=ds(new Date());if(!was&&x.k===t){const H=d.habits;if(H.every(z=>(d.log[z.id]||{})[t]))pop("🎉 Perfect day! Every habit done.",1);else{const n=streak(x.h);n>1&&MS.includes(n)?pop("🔥 "+n+"-day streak on "+H.find(z=>z.id===x.h).name+"!",1):pop(CHEER[Math.floor(Math.random()*CHEER.length)])}}}
else if(a==="mood"){const t=ds(new Date());d.mood[t]===+x.v?delete d.mood[t]:d.mood[t]=+x.v;save()}
else if(a==="starter"){const s=START[x.i];d.habits.push({id:"h"+Date.now()+x.i,emoji:s[0],name:s[1],perWeek:s[2]});save()}
else if(a==="new")modal={name:"",emoji:"🎯",perWeek:7,color:PAL[Date.now()%PAL.length]};
else if(a==="edit"){const h=d.habits.find(z=>z.id===x.h);modal={id:h.id,name:h.name,emoji:h.emoji,perWeek:h.perWeek,color:col(h)}}
else if(a==="emoji"){sync();modal.emoji=x.v}
else if(a==="color"){sync();modal.color=x.v}
else if(a==="pw7"){sync();modal.perWeek=+x.v}
else if(a==="close"||a==="close2")modal=null;
else if(a==="del"){d.habits=d.habits.filter(z=>z.id!==modal.id);delete d.log[modal.id];modal=null;save()}
render()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.sl){const v=parseFloat(String(t.value).replace(",",".")),k=ds(new Date()),d=D();v>0&&v<=24?d.sleep[k]=v:delete d.sleep[k];save();render()}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
if(f.id==="af"){const up=mode==="up",nm=up?f.fn.value.trim():"",em=f.em.value.trim().toLowerCase(),pw=f.pw.value;draft={fn:nm,em:em};err="";
if(up&&!nm)err="Enter your name.";else if(!/^\S+@\S+\.\S+$/.test(em))err="Enter a valid email address.";else if(pw.length<8&&up)err="Use at least 8 characters for your password.";else if(!pw)err="Enter your password.";
if(!err){try{if(up){if(DB.users[em])err="That email already has an account here. Sign in instead.";else{const s=rnd();DB.users[em]={name:nm,salt:s,hash:await hash(pw,s)};DB.session=em;view="today"}}else{const u=DB.users[em];if(!u||u.hash!==await hash(pw,u.salt))err="Email or password is incorrect.";else{DB.session=em;view="today"}}}catch(x){err="This browser can't create a secure sign-in."}}
if(!err){draft={fn:"",em:""};save()}render()}
else if(f.id==="hf"){sync();const n=modal.name.trim();if(!n){modal.err="Give your habit a name.";render();return}const d=D();
if(modal.id){const h=d.habits.find(z=>z.id===modal.id);h.name=n;h.emoji=modal.emoji;h.perWeek=modal.perWeek;h.color=modal.color}else d.habits.push({id:"h"+Date.now(),name:n,emoji:modal.emoji,perWeek:modal.perWeek,color:modal.color});
modal=null;save();render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal){modal=null;render()}});
render();
})();
</script>
</body>
</html>
